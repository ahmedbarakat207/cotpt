[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cotpt"
version = "0.1.0"
description = "Per-token hidden deliberation with KV-cache eviction, plus a COTPT-style think/talk/learn training loop"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers>=4.51.0",
]

[project.optional-dependencies]
dev = ["pytest"]
lora = ["peft", "accelerate"]
data = ["datasets"]
tracking = ["wandb"]
all = ["pytest", "peft", "accelerate", "datasets", "wandb"]

[tool.setuptools.packages.find]
where = ["src"]
